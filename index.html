<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghana Invoice Generator | Free Invoice Maker</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a472a;
            --primary-light: #2d5a3d;
            --accent: #d4a574;
            --accent-light: #e8c4a0;
            --bg: #f8f9fa;
            --border: #e0e0e0;
            --text: #333;
            --text-light: #666;
            --success: #27ae60;
            --danger: #e74c3c;
            --white: #ffffff;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        .form-section {
            flex: 1;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            overflow-y: auto;
            min-width: 400px;
        }

        .preview-section {
            flex: 1;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
            overflow-y: auto;
            min-width: 400px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .subtitle {
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--text);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 71, 42, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        input[type="file"] {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
        }

        .logo-preview {
            width: 80px;
            height: 80px;
            border: 2px dashed var(--border);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            overflow: hidden;
            background: #f0f0f0;
        }

        .logo-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .line-items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        .line-items-table th {
            background: var(--bg);
            padding: 10px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--border);
            color: var(--text);
        }

        .line-items-table td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
        }

        .line-items-table input {
            margin: 0;
        }

        .line-items-table .delete-btn {
            background: var(--danger);
            color: var(--white);
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.3s;
        }

        .line-items-table .delete-btn:hover {
            background: #c0392b;
        }

        .add-line-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .add-line-btn:hover {
            background: var(--primary-light);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            flex: 1;
            min-width: 150px;
        }

        .btn-primary:hover {
            background: var(--primary-light);
            box-shadow: 0 4px 12px rgba(26, 71, 42, 0.2);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--primary);
            border: 2px solid var(--primary);
            flex: 1;
            min-width: 150px;
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: var(--white);
        }

        /* Invoice Preview Styles */
        .invoice-preview {
            background: var(--white);
            padding: 40px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            line-height: 1.6;
        }

        .invoice-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 20px;
        }

        .invoice-logo {
            max-width: 120px;
            max-height: 120px;
        }

        .invoice-logo img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .business-info {
            flex: 1;
            margin-left: 20px;
        }

        .business-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .business-details {
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.5;
        }

        .invoice-title {
            text-align: right;
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .invoice-number {
            text-align: right;
            font-size: 12px;
            color: var(--text-light);
        }

        .invoice-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .meta-section h3 {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .meta-section p {
            font-size: 13px;
            color: var(--text);
            line-height: 1.6;
        }

        .invoice-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .invoice-table thead {
            background: var(--primary);
            color: var(--white);
        }

        .invoice-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .invoice-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .invoice-table tbody tr:last-child td {
            border-bottom: 2px solid var(--primary);
        }

        .amount-col {
            text-align: right;
        }

        .invoice-totals {
            width: 100%;
            margin-bottom: 20px;
        }

        .totals-row {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .totals-label {
            width: 150px;
            text-align: right;
            font-weight: 500;
        }

        .totals-value {
            width: 100px;
            text-align: right;
        }

        .totals-row.grand-total {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            padding-top: 10px;
            border-top: 2px solid var(--accent);
            margin-top: 10px;
        }

        .payment-terms {
            background: var(--bg);
            padding: 15px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .payment-terms h4 {
            font-size: 12px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        @media (max-width: 1200px) {
            .container {
                flex-direction: column;
            }

            .form-section,
            .preview-section {
                flex: 1;
                min-width: auto;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
                gap: 10px;
            }

            .form-section,
            .preview-section {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 22px;
            }

            .invoice-header {
                flex-direction: column;
            }

            .business-info {
                margin-left: 0;
                margin-top: 15px;
            }

            .invoice-title {
                text-align: left;
                margin-top: 15px;
            }

            .invoice-meta {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
            }

            .line-items-table {
                font-size: 12px;
            }

            .line-items-table th,
            .line-items-table td {
                padding: 8px;
            }

            .invoice-preview {
                padding: 20px;
            }

            .invoice-table th,
            .invoice-table td {
                padding: 8px;
                font-size: 12px;
            }
        }

        @media print {
            body {
                background: var(--white);
            }

            .container {
                display: block;
                padding: 0;
                gap: 0;
            }

            .form-section {
                display: none;
            }

            .preview-section {
                box-shadow: none;
                border: none;
                padding: 0;
                min-width: 100%;
            }

            .invoice-preview {
                box-shadow: none;
                border: none;
                padding: 20px;
            }

            .button-group {
                display: none;
            }
        }

        .currency-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }

        .currency-selector select {
            width: auto;
            padding: 8px 12px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-light);
            padding: 40px 20px;
            font-size: 14px;
        }

        .vat-info {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 5px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--text-light);
        }

        .loading.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- FORM SECTION -->
        <div class="form-section">
            <h1>📄 Invoice Generator</h1>
            <p class="subtitle">Create professional invoices in seconds. Works offline.</p>

            <!-- Currency Selector -->
            <div class="currency-selector">
                <label for="currency">Currency:</label>
                <select id="currency" onchange="updateCurrency()">
                    <option value="GHS">₵ GHS (Ghana Cedis)</option>
                    <option value="USD">$ USD (US Dollars)</option>
                    <option value="EUR">€ EUR (Euros)</option>
                </select>
            </div>

            <!-- Business Information -->
            <div class="section-title">Your Business</div>

            <div class="form-group">
                <label for="businessName">Business Name *</label>
                <input type="text" id="businessName" placeholder="e.g., Accra Tech Solutions" oninput="updatePreview()">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="businessPhone">Phone</label>
                    <input type="tel" id="businessPhone" placeholder="+233 XX XXX XXXX" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label for="businessEmail">Email</label>
                    <input type="email" id="businessEmail" placeholder="hello@business.com" oninput="updatePreview()">
                </div>
            </div>

            <div class="form-group">
                <label for="businessAddress">Business Address</label>
                <textarea id="businessAddress" placeholder="Street address, city, region" oninput="updatePreview()"></textarea>
            </div>

            <div class="form-group">
                <label for="logoUpload">Logo (Optional)</label>
                <input type="file" id="logoUpload" accept="image/*" onchange="handleLogoUpload()">
                <div class="logo-preview" id="logoPreview"></div>
            </div>

            <!-- Client Information -->
            <div class="section-title">Client Details</div>

            <div class="form-group">
                <label for="clientName">Client Name *</label>
                <input type="text" id="clientName" placeholder="e.g., John Mensah" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label for="clientAddress">Client Address</label>
                <textarea id="clientAddress" placeholder="Street address, city, region" oninput="updatePreview()"></textarea>
            </div>

            <!-- Invoice Details -->
            <div class="section-title">Invoice Details</div>

            <div class="form-row">
                <div class="form-group">
                    <label for="invoiceNumber">Invoice Number *</label>
                    <input type="text" id="invoiceNumber" placeholder="INV-001" oninput="updatePreview()">
                </div>
                <div class="form-group">
                    <label for="invoiceDate">Invoice Date *</label>
                    <input type="date" id="invoiceDate" oninput="updatePreview()">
                </div>
            </div>

            <!-- Line Items -->
            <div class="section-title">Line Items</div>

            <div id="lineItemsContainer">
                <!-- Dynamically populated -->
            </div>

            <button class="add-line-btn" onclick="addLineItem()">+ Add Line Item</button>

            <!-- Calculations Section -->
            <div class="section-title">Calculations</div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>Subtotal:</label>
                    <strong id="subtotalDisplay">₵0.00</strong>
                </div>
            </div>

            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="vatToggle" onchange="updatePreview()">
                    <label for="vatToggle" style="margin-bottom: 0;">Apply VAT (15%)</label>
                </div>
                <div class="vat-info">Ghana VAT is 15% of subtotal</div>
                <div style="margin-top: 8px; display: flex; justify-content: space-between; align-items: center;">
                    <label>VAT:</label>
                    <strong id="vatDisplay">₵0.00</strong>
                </div>
            </div>

            <div class="form-group">
                <label for="discountAmount">Discount (Optional)</label>
                <input type="number" id="discountAmount" placeholder="0" min="0" step="0.01" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label>Grand Total:</label>
                    <strong id="grandTotalDisplay" style="font-size: 18px; color: var(--primary);">₵0.00</strong>
                </div>
            </div>

            <!-- Payment Terms -->
            <div class="section-title">Payment Terms & Notes</div>

            <div class="form-group">
                <label for="paymentTerms">Notes / Payment Terms</label>
                <textarea id="paymentTerms" placeholder="e.g., Payment due in 7 days. Bank: ABC Bank, Account: 123456789" oninput="updatePreview()"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="button-group">
                <button class="btn-primary" onclick="downloadPDF()">📥 Download as PDF</button>
                <button class="btn-secondary" onclick="window.print()">🖨️ Print</button>
                <button class="btn-secondary" onclick="resetForm()">🔄 Reset</button>
            </div>

            <div class="loading" id="pdfLoading">Generating PDF...</div>
        </div>

        <!-- PREVIEW SECTION -->
        <div class="preview-section">
            <div id="invoicePreview" class="invoice-preview">
                <div class="empty-state">
                    👆 Fill in the form to see your invoice preview here
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== INITIALIZATION ====================

        const lineItemsLimit = 50;
        let logoDataUrl = '';

        // Set today's date as default
        document.getElementById('invoiceDate').valueAsDate = new Date();

        // Initialize first line item
        addLineItem();

        // ==================== CURRENCY MANAGEMENT ====================

        function getCurrencySymbol() {
            const currency = document.getElementById('currency').value;
            const symbols = {
                'GHS': '₵',
                'USD': '$',
                'EUR': '€'
            };
            return symbols[currency] || '₵';
        }

        function updateCurrency() {
            updatePreview();
        }

        function formatCurrency(amount) {
            const symbol = getCurrencySymbol();
            return symbol + parseFloat(amount).toFixed(2);
        }

        // ==================== LOGO HANDLING ====================

        function handleLogoUpload() {
            const file = document.getElementById('logoUpload').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    logoDataUrl = e.target.result;
                    displayLogoPreview();
                    updatePreview();
                };
                reader.readAsDataURL(file);
            }
        }

        function displayLogoPreview() {
            const preview = document.getElementById('logoPreview');
            if (logoDataUrl) {
                preview.innerHTML = `<img src="${logoDataUrl}" alt="Business Logo">`;
            } else {
                preview.innerHTML = '';
            }
        }

        // ==================== LINE ITEMS MANAGEMENT ====================

        function addLineItem() {
            const container = document.getElementById('lineItemsContainer');
            const currentCount = container.querySelectorAll('.line-item').length;

            if (currentCount >= lineItemsLimit) {
                alert(`Maximum ${lineItemsLimit} line items allowed.`);
                return;
            }

            const lineItemId = `line-item-${Date.now()}`;
            const lineItem = document.createElement('div');
            lineItem.className = 'line-item';
            lineItem.id = lineItemId;
            lineItem.innerHTML = `
                <div style="display: grid; grid-template-columns: 3fr 1fr 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px;">
                    <input type="text" class="line-description" placeholder="Description" oninput="updatePreview()">
                    <input type="number" class="line-quantity" placeholder="Qty" min="0" step="1" value="1" oninput="updatePreview()">
                    <input type="number" class="line-unitPrice" placeholder="Unit Price" min="0" step="0.01" oninput="updatePreview()">
                    <button class="delete-btn" onclick="deleteLineItem('${lineItemId}')">🗑️</button>
                </div>
            `;

            container.appendChild(lineItem);
            updatePreview();
        }

        function deleteLineItem(itemId) {
            const container = document.getElementById('lineItemsContainer');
            const item = document.getElementById(itemId);
            
            if (item) {
                item.remove();
            }

            // Ensure at least one line item remains
            if (container.querySelectorAll('.line-item').length === 0) {
                addLineItem();
            } else {
                updatePreview();
            }
        }

        function getLineItems() {
            const items = [];
            document.querySelectorAll('.line-item').forEach(item => {
                const description = item.querySelector('.line-description').value.trim();
                const quantity = parseFloat(item.querySelector('.line-quantity').value) || 0;
                const unitPrice = parseFloat(item.querySelector('.line-unitPrice').value) || 0;

                if (description && quantity > 0 && unitPrice > 0) {
                    items.push({
                        description,
                        quantity,
                        unitPrice,
                        total: quantity * unitPrice
                    });
                }
            });
            return items;
        }

        // ==================== CALCULATIONS ====================

        function calculateTotals() {
            const lineItems = getLineItems();
            
            let subtotal = 0;
            lineItems.forEach(item => {
                subtotal += item.total;
            });

            const vatApplied = document.getElementById('vatToggle').checked;
            const vat = vatApplied ? subtotal * 0.15 : 0;
            
            const discount = parseFloat(document.getElementById('discountAmount').value) || 0;
            
            const grandTotal = subtotal + vat - discount;

            return {
                subtotal: Math.round(subtotal * 100) / 100,
                vat: Math.round(vat * 100) / 100,
                discount: Math.round(discount * 100) / 100,
                grandTotal: Math.round(grandTotal * 100) / 100
            };
        }

        // ==================== PREVIEW UPDATE ====================

        function updatePreview() {
            const businessName = document.getElementById('businessName').value.trim();
            const businessPhone = document.getElementById('businessPhone').value.trim();
            const businessEmail = document.getElementById('businessEmail').value.trim();
            const businessAddress = document.getElementById('businessAddress').value.trim();
            const clientName = document.getElementById('clientName').value.trim();
            const clientAddress = document.getElementById('clientAddress').value.trim();
            const invoiceNumber = document.getElementById('invoiceNumber').value.trim();
            const invoiceDate = document.getElementById('invoiceDate').value;
            const paymentTerms = document.getElementById('paymentTerms').value.trim();

            const lineItems = getLineItems();
            const totals = calculateTotals();

            // Update summary displays
            document.getElementById('subtotalDisplay').textContent = formatCurrency(totals.subtotal);
            document.getElementById('vatDisplay').textContent = formatCurrency(totals.vat);
            document.getElementById('grandTotalDisplay').textContent = formatCurrency(totals.grandTotal);

            // Generate invoice preview
            let invoiceHTML = '';

            if (!businessName && !clientName && lineItems.length === 0) {
                document.getElementById('invoicePreview').innerHTML = `
                    <div class="empty-state">
                        👆 Fill in the form to see your invoice preview here
                    </div>
                `;
                return;
            }

            // Invoice header
            invoiceHTML += '<div class="invoice-header">';
            
            if (logoDataUrl) {
                invoiceHTML += `<div class="invoice-logo"><img src="${logoDataUrl}" alt="Logo"></div>`;
            }

            invoiceHTML += '<div class="business-info">';
            if (businessName) {
                invoiceHTML += `<div class="business-name">${escapeHTML(businessName)}</div>`;
            }
            invoiceHTML += '<div class="business-details">';
            if (businessAddress) {
                invoiceHTML += `${escapeHTML(businessAddress)}<br>`;
            }
            if (businessPhone) {
                invoiceHTML += `${escapeHTML(businessPhone)}<br>`;
            }
            if (businessEmail) {
                invoiceHTML += `${escapeHTML(businessEmail)}`;
            }
            invoiceHTML += '</div></div>';

            invoiceHTML += '<div style="text-align: right;">';
            invoiceHTML += '<div class="invoice-title">INVOICE</div>';
            if (invoiceNumber) {
                invoiceHTML += `<div class="invoice-number">Invoice #${escapeHTML(invoiceNumber)}</div>`;
            }
            invoiceHTML += '</div></div>';

            // Invoice meta
            invoiceHTML += '<div class="invoice-meta">';
            
            invoiceHTML += '<div class="meta-section">';
            invoiceHTML += '<h3>Bill To:</h3>';
            if (clientName) {
                invoiceHTML += `<p><strong>${escapeHTML(clientName)}</strong></p>`;
            }
            if (clientAddress) {
                invoiceHTML += `<p>${escapeHTML(clientAddress)}</p>`;
            }
            invoiceHTML += '</div>';

            invoiceHTML += '<div class="meta-section">';
            invoiceHTML += '<h3>Invoice Details:</h3>';
            if (invoiceDate) {
                invoiceHTML += `<p><strong>Date:</strong> ${formatDateDisplay(invoiceDate)}</p>`;
            }
            if (invoiceNumber) {
                invoiceHTML += `<p><strong>Invoice #:</strong> ${escapeHTML(invoiceNumber)}</p>`;
            }
            invoiceHTML += '</div>';

            invoiceHTML += '</div>';

            // Line items table
            if (lineItems.length > 0) {
                invoiceHTML += '<table class="invoice-table">';
                invoiceHTML += '<thead><tr>';
                invoiceHTML += '<th style="width: 50%;">Description</th>';
                invoiceHTML += '<th style="width: 15%; text-align: center;">Qty</th>';
                invoiceHTML += '<th style="width: 15%; text-align: right;">Unit Price</th>';
                invoiceHTML += '<th style="width: 20%; text-align: right;">Amount</th>';
                invoiceHTML += '</tr></thead>';
                invoiceHTML += '<tbody>';

                lineItems.forEach(item => {
                    invoiceHTML += '<tr>';
                    invoiceHTML += `<td>${escapeHTML(item.description)}</td>`;
                    invoiceHTML += `<td style="text-align: center;">${item.quantity}</td>`;
                    invoiceHTML += `<td class="amount-col">${formatCurrency(item.unitPrice)}</td>`;
                    invoiceHTML += `<td class="amount-col">${formatCurrency(item.total)}</td>`;
                    invoiceHTML += '</tr>';
                });

                invoiceHTML += '</tbody>';
                invoiceHTML += '</table>';

                // Totals
                invoiceHTML += '<div class="invoice-totals">';
                invoiceHTML += `<div class="totals-row">
                    <div class="totals-label">Subtotal:</div>
                    <div class="totals-value">${formatCurrency(totals.subtotal)}</div>
                </div>`;

                if (document.getElementById('vatToggle').checked) {
                    invoiceHTML += `<div class="totals-row">
                        <div class="totals-label">VAT (15%):</div>
                        <div class="totals-value">${formatCurrency(totals.vat)}</div>
                    </div>`;
                }

                if (totals.discount > 0) {
                    invoiceHTML += `<div class="totals-row">
                        <div class="totals-label">Discount:</div>
                        <div class="totals-value">-${formatCurrency(totals.discount)}</div>
                    </div>`;
                }

                invoiceHTML += `<div class="totals-row grand-total">
                    <div class="totals-label">Total Due:</div>
                    <div class="totals-value">${formatCurrency(totals.grandTotal)}</div>
                </div>`;
                invoiceHTML += '</div>';
            }

            // Payment terms
            if (paymentTerms) {
                invoiceHTML += '<div class="payment-terms">';
                invoiceHTML += '<h4>Notes:</h4>';
                invoiceHTML += `<p>${escapeHTML(paymentTerms).replace(/\n/g, '<br>')}</p>`;
                invoiceHTML += '</div>';
            }

            document.getElementById('invoicePreview').innerHTML = invoiceHTML;
        }

        // ==================== PDF GENERATION ====================

        async function downloadPDF() {
            const businessName = document.getElementById('businessName').value.trim();
            const invoiceNumber = document.getElementById('invoiceNumber').value.trim();

            if (!businessName) {
                alert('Please enter your business name.');
                return;
            }

            if (!invoiceNumber) {
                alert('Please enter an invoice number.');
                return;
            }

            const loadingDiv = document.getElementById('pdfLoading');
            loadingDiv.classList.add('active');

            try {
                const invoiceElement = document.getElementById('invoicePreview');
                const canvas = await html2canvas(invoiceElement, {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: '#ffffff',
                    logging: false
                });

                const imgData = canvas.toDataURL('image/png');
                const pdf = new jspdf.jsPDF({
                    orientation: 'portrait',
                    unit: 'mm',
                    format: 'a4'
                });

                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = pdf.internal.pageSize.getHeight();
                const imgWidth = pdfWidth - 10;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                pdf.addImage(imgData, 'PNG', 5, 5, imgWidth, imgHeight);

                const fileName = `Invoice_${invoiceNumber}_${new Date().toISOString().split('T')[0]}.pdf`;
                pdf.save(fileName);
            } catch (error) {
                console.error('PDF generation error:', error);
                alert('Error generating PDF. Please check the browser console and ensure all data is valid.');
            } finally {
                loadingDiv.classList.remove('active');
            }
        }

        // ==================== UTILITY FUNCTIONS ====================

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '';
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', options);
        }

        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function resetForm() {
            if (confirm('Reset all data? This cannot be undone.')) {
                document.getElementById('businessName').value = '';
                document.getElementById('businessPhone').value = '';
                document.getElementById('businessEmail').value = '';
                document.getElementById('businessAddress').value = '';
                document.getElementById('clientName').value = '';
                document.getElementById('clientAddress').value = '';
                document.getElementById('invoiceNumber').value = '';
                document.getElementById('invoiceDate').valueAsDate = new Date();
                document.getElementById('paymentTerms').value = '';
                document.getElementById('vatToggle').checked = false;
                document.getElementById('discountAmount').value = '0';
                document.getElementById('logoUpload').value = '';
                document.getElementById('currency').value = 'GHS';

                logoDataUrl = '';
                displayLogoPreview();

                const container = document.getElementById('lineItemsContainer');
                container.innerHTML = '';
                addLineItem();

                updatePreview();
            }
        }
    </script>
